
name: Build C++ EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Create EXE Folder
        run: mkdir -p exe

      - name: Compile C++
        run: |
          x86_64-w64-mingw32-g++ main.cpp -o exe/main.exe -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-exe
          path: exe/main.exe
